
name: Install Statsify Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract uploaded ZIP
        run: |
          ZIP="statsify-fix-apple-spotify.zip"
          test -f "$ZIP" || exit 1

          mkdir -p /tmp/statsify
          unzip -q "$ZIP" -d /tmp/statsify

          PROJECT_DIR="/tmp/statsify/spotify-stats"
          test -d "$PROJECT_DIR" || exit 1

          cp -a "$PROJECT_DIR"/. .
          rm "$ZIP"

      - name: Commit and push changes
        run: |
          git config user.name "rimmuu"
          git config user.email "20427697+rimmuu@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Fix Apple Music and Spotify"
          git push
